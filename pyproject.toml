[project]
name = "pathfinder"
version = "0.1.0"
description = "Find path based on given conditions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.6",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "osmnx>=2.1.0",
    "pandas>=3.0.1",
    "pathlib>=1.0.1",
    "rasterio>=1.4.4",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.packages.find]
include = ["pathfinder*"]
