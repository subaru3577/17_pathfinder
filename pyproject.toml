[project]
name = "pathfinder"
version = "0.1.0"
description = "Find path based on given conditions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Subaru"}]
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
    "mapclassify>=2.8.1",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openmeteo-requests>=1.7.5",
    "openpyxl>=3.1.5",
    "osmnx>=2.0.7",
    "pandas>=2.3.3",
    "rasterio>=1.4.4",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.2",
    "typer>=0.26.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
]

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.packages.find]
include = ["pathfinder*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=pathfinder",
    "--cov-report=term-missing",
    "--cov-report=html:reports/htmlcov",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
    "--html=reports/report.html",
    "--self-contained-html",
]

[tool.coverage.run]
branch = true
source = ["pathfinder"]

[tool.coverage.report]
show_missing = true
